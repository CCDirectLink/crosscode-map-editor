name: release
on:
  push:
    tags:
      - '*'
jobs:
  build:
    name: create release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: '26'
      - uses: ./.github/actions/build

      - name: Get version from tag
        id: tag_name
        run: |
          echo ::set-output name=current_version::${GITHUB_REF#refs/tags/v}
        shell: bash

      - name: Get Changelog Entry
        if: matrix.os == 'ubuntu-latest'
        id: changelog_reader
        uses: mindsers/changelog-reader-action@v2
        with:
          validation_depth: 10
          version: ${{ steps.tag_name.outputs.current_version }}
          path: ./CHANGELOG.md

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          body: ${{ steps.changelog_reader.outputs.changes }}
          files: webapp/dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # publishes the web build to the root of the gh-pages branch.
      # pr-preview/ holds the pull request previews (see pr_preview.yml) and must survive this deploy,
      # force: false makes the action rebase instead of force pushing over concurrent preview deploys
      - name: Deploy to GitHub Pages
        if: matrix.os == 'ubuntu-latest'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: webapp/distAngular
          branch: gh-pages
          clean-exclude: pr-preview
          force: false

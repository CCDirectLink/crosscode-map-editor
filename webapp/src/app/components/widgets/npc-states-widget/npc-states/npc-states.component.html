<cc-overlay-panel>
	<ng-container ngProjectAs="toolbar">
		<div class="px-3 gap-3 flex flex-row">
			<button mat-stroked-button (click)="newPage()">New Page</button>
			<button mat-stroked-button (click)="copyPage()">Copy Page</button>
			<button mat-stroked-button (click)="pastePage()" [disabled]="!clipboard">Paste Page</button>
			<button mat-stroked-button (click)="removePage()">Remove Page</button>
		</div>
	</ng-container>
	<ng-container ngProjectAs="content">
		<div class="h-full flex flex-col">
			<mat-tab-group id="groupTabGroup"
			               animationDuration="0ms"
			               mat-stretch-tabs="false"
			               (selectedIndexChange)="selectTab($event)"
			               [selectedIndex]="index">
				@for (state of states; track state; let index = $index) {
					<mat-tab [label]="state.pageName && state.pageName.trim() ? state.pageName : ((index + 1) + '')">
					</mat-tab>
				}
			</mat-tab-group>
			
			@if (currentState) {
				<div class="tab-content flex flex-col grow">
					<div class="flex flex-row items-center p-3 gap-2">
						<label [for]="condition">Condition:</label>
						<input class="default-input" #condition [(ngModel)]="currentState.condition">
					</div>

					<div class="tab-content-inner flex flex-row grow overflow-hidden">
						<div class="w-[250px] flex flex-col px-3">
							
							<!-- Position -->
							<div class="flex flex-row">
								<mat-checkbox color="primary" [(ngModel)]="currentState.position!.active">
									Position
								</mat-checkbox>
							</div>
							@if (currentState.position!.active) {
								<div class="grid grid-cols-3 gap-2">
									<label>Pos:</label>
									<div class="flex">
										<label class="property-name-small">X:</label>
										<input type="number" class="default-input small-input" [(ngModel)]="currentState.position!.x">
									</div>
									<div class="flex">
										<label class="property-name-small">Y:</label>
										<input type="number" class="default-input small-input" [(ngModel)]="currentState.position!.y">
									</div>
									<label [for]="level">Level:</label>
									<input #level type="number" class="default-input small-input" min="0" [(ngModel)]="currentState.position!.lvl">
									<div class="flex">
										<label for="offset" class="property-name-small">+</label>
										<input disabled id="offset" type="number" class="default-input small-input">
									</div>
									<br><br>
								</div>
							}

							<app-string-widget [custom]="currentState" key="pageName" />
							<app-string-widget [custom]="this" key="eventType" [attribute]="attributes.eventType" />
							@if (isTradeEvent) {
								<app-string-widget [custom]="this" key="trader" />
							}
							<app-string-widget [custom]="currentState" key="reactType" [attribute]="attributes.reactType" />
							<app-string-widget [custom]="currentState" key="face" [attribute]="attributes.face" />
							<app-string-widget [custom]="currentState" key="config" [attribute]="attributes.config" />
							<app-event-widget [custom]="currentState" key="action" [attribute]="attributes.action" />
							<app-json-widget [custom]="currentState" key="showFx" [attribute]="attributes.showFx" />
							<app-json-widget [custom]="currentState" key="hideFx" [attribute]="attributes.hideFx" />
							<app-json-widget [custom]="currentState" key="permaFx" [attribute]="attributes.permaFx" />
							<app-boolean-widget [custom]="currentState" key="hidden" [attribute]="attributes.hidden" />
							<app-json-widget [custom]="currentState" key="door" [attribute]="attributes.door" />
							
							@for (warning of warnings; track warning) {
								<div class="flex flex-row warning-message">
									<mat-icon class="!w-7 shrink-0">warning</mat-icon>
									<span>{{ warning }}</span>
								</div>
							}
						</div>
						<div class="min-w-0 flex flex-col grow">
							<app-event-editor #eventEditor class="mx-2 flex flex-col"
							                  [eventData]="currentState.event"
							                  (eventsChanged)="updateTradeEventWarning($event)"
							></app-event-editor>
						</div>
					</div>
				</div>
			}
		</div>
	</ng-container>
	<ng-container ngProjectAs="actions">
		<button mat-stroked-button (click)="cancel()">Cancel</button>
		<button mat-stroked-button (click)="save()">Save</button>
	</ng-container>
</cc-overlay-panel>

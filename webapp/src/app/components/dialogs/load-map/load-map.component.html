<div class="sidenav flex flex-col">
	<div>
		<mat-toolbar class="flex flex-row justify-between">
			<div>
				<span class="mat-headline">Load map</span>
			</div>
			<div>
				<button mat-icon-button (click)="openMap()">
					<mat-icon>open_in_new</mat-icon>
				</button>
				<button mat-icon-button (click)="maps.reload()">
					<mat-icon>refresh</mat-icon>
				</button>
				<button mat-icon-button (click)="close()">
					<mat-icon>close</mat-icon>
				</button>
			</div>
		</mat-toolbar>
		
		<div class="filter no-error-msg flex flex-col">
			<mat-form-field
				appearance="outline"
			>
				<input #filterInput matInput type="text" placeholder="Filter" [(ngModel)]="filter"
				       (ngModelChange)="update()"/>
			</mat-form-field>
		</div>
	</div>
	<div class="map-list">
		@if (!maps.isLoading()) {
			<mat-tree #tree [dataSource]="nodes" [childrenAccessor]="childrenAccessor" class="mapTree">
				<mat-tree-node *matTreeNodeDef="let node; when: isSection" class="mapTree-section" isExpandable>
					<button class="section-header" matTreeNodeToggle>
						<span class="section-name">{{ node.names[0] }}</span>
						<span class="section-count">{{ node.mapCount }}</span>
					</button>
				</mat-tree-node>
				
				<mat-tree-node *matTreeNodeDef="let node" #treeNode="matTreeNode" class="mapTree-row"
				               [style.--depth]="treeNode.level - 1">
					<button mat-button class="mapTree-button" [class.overridden]="node.file?.overridden"
					        (click)="node.file ? load(node.file) : openMap()">
						<mat-icon class="icon">edit</mat-icon>
						@for (name of node.names; track name; let isLast = $last) {
							<span>
								<a appHighlight [highlightText]="name" [highlightMatch]="filter"></a>
								@if (!isLast) {
									<a class="separator">/</a>
								}
							</span>
						}
						@if (node.file?.overrides) {
							<mat-icon iconPositionEnd class="override" title="Replaces a map with the same path">swap_horiz</mat-icon>
						}
					</button>
				</mat-tree-node>
				
				<mat-tree-node *matTreeNodeDef="let node; when: hasChild" #treeNode="matTreeNode" class="mapTree-row"
				               [style.--depth]="treeNode.level - 1" isExpandable>
					<button mat-button class="mapTree-button" matTreeNodeToggle>
						<mat-icon class="icon mat-icon-rtl-mirror">
							{{ tree.isExpanded(node) ? 'expand_more' : 'chevron_right' }}
						</mat-icon>
						@for (name of node.names; track name; let isLast = $last) {
							<span>
								<a appHighlight [highlightText]="name" [highlightMatch]="filter"></a>
								@if (!isLast) {
									<a class="separator">/</a>
								}
							</span>
						}
					</button>
				</mat-tree-node>
			</mat-tree>
		} @else {
			
			<div class="loader">
				<mat-spinner [diameter]="40" [strokeWidth]="5"></mat-spinner>
			</div>
			
		}
	
	</div>
</div>
